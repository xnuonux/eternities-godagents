name: Portable smoke

on:
  push:
    branches: [main, 'refine/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-runtime:
    name: Local runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify portable demo and local runtime
        run: node --test --test-concurrency=4 tests/demo.test.mjs tests/foundry.test.mjs tests/journal-recovery.test.mjs tests/scheduler-arbiter.test.mjs
      - name: Run the documented first command
        run: npm run demo
